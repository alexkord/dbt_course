models:
  - name: fct_bookings
    description: Fact table of bookings
    docs:
      show: true
      node_color: red
    latest_version: 2
    versions:
      - v: 2
      - v: 1
    config:
      contract: {enforced: true}
    meta:
      owner: "olegche"
      dbt_version: 1.5.0
    
    columns:
      - name: book_ref
        data_type: varchar(8)
        constraints:
          - type: not_null
      - name: book_date
        data_type: timestamptz
      - name: total_amount
        data_type: numeric(10,2)
        constraints:
          - type: check
            expression: total_amount >= 0
        tests:
          - not_null
        meta:
          owner: finance
        quote: false